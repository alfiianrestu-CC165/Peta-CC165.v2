<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 44" width="210" height="44" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cc-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#034b8c" />
    </linearGradient>
    <linearGradient id="cc-orange-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="cc-num-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0265a3" />
      <stop offset="100%" stop-color="#009b4c" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Left Emblem (Headset & Agent Badge) -->
  <g transform="translate(2, 2)">
    <!-- Base Background Circle with soft border -->
    <circle cx="20" cy="20" r="19.5" fill="white" stroke="#e2e8f0" stroke-width="0.8" />
    
    <!-- Outer Dynamic Orbit (Orange accent arc) -->
    <path d="M 6 26 A 17 17 0 0 0 35 24" fill="none" stroke="url(#cc-orange-grad)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Main Circle Badge -->
    <circle cx="20" cy="19" r="14.5" fill="url(#cc-blue-grad)" filter="url(#subtle-shadow)" />
    
    <!-- Headset Band (Over Head) -->
    <path d="M 14.5 18 C 14.5 13.5 17 12 20 12 C 23 12 25.5 13.5 25.5 18" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Left Ear Cup -->
    <rect x="13.2" y="16.5" width="2.4" height="4.8" rx="1.2" fill="#ffffff" />
    
    <!-- Right Ear Cup -->
    <rect x="24.4" y="16.5" width="2.4" height="4.8" rx="1.2" fill="#ffffff" />
    
    <!-- Head Silhouette -->
    <circle cx="20" cy="17.2" r="3.2" fill="#ffffff" />
    
    <!-- Body / Shoulders -->
    <path d="M 14.8 25 C 15 22.2 17.2 21.2 20 21.2 C 22.8 21.2 25 22.2 25.2 25 Z" fill="#ffffff" />
    
    <!-- Microphone boom curving from left ear cup to mouth -->
    <path d="M 14.5 19.5 Q 16 23.5 19.5 23" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="19.8" cy="23" r="1" fill="#f59e0b" />
    
    <!-- Sound Waves / Connection Signal -->
    <path d="M 28 15 Q 30 19 28 23" fill="none" stroke="#009b4c" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(48, 0)">
    <!-- "CARE CENTER" Text -->
    <text x="0" y="17" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" 
          font-size="11.5" 
          font-weight="800" 
          letter-spacing="1.8" 
          fill="#0f2e59">
      CARE CENTER
    </text>

    <!-- "165" Numeral -->
    <text x="0" y="37" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" 
          font-size="20" 
          font-weight="900" 
          letter-spacing="0.5" 
          fill="url(#cc-num-grad)">
      165
    </text>

    <!-- Pill Tag: 24 JAM -->
    <g transform="translate(56, 23)">
      <rect x="0" y="0" width="46" height="15" rx="7.5" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8" />
      <circle cx="6.5" cy="7.5" r="2.5" fill="#16a34a" />
      <text x="12" y="10.8" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" 
            font-size="8" 
            font-weight="700" 
            letter-spacing="0.4" 
            fill="#15803d">
        24 JAM
      </text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48" fill="none">
  <defs>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#004f98" />
    </linearGradient>
    <linearGradient id="num-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004f98" />
      <stop offset="70%" stop-color="#0265a3" />
      <stop offset="100%" stop-color="#009b4c" />
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circular Badge with Customer Support Agent -->
  <g transform="translate(2, 2)">
    <!-- Outer accent glow circle -->
    <circle cx="22" cy="22" r="21.5" fill="white" stroke="#e2e8f0" stroke-width="0.75" />
    <circle cx="22" cy="22" r="18.5" fill="url(#badge-grad)" filter="url(#soft-shadow)" />
    
    <!-- Headset Arch -->
    <path d="M 15.5 21 C 15.5 15.2 18.5 13.8 22 13.8 C 25.5 13.8 28.5 15.2 28.5 21" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" />
    
    <!-- Left & Right Ear Cushions -->
    <rect x="14.2" y="19" width="2.6" height="5" rx="1.3" fill="#ffffff" />
    <rect x="27.2" y="19" width="2.6" height="5" rx="1.3" fill="#ffffff" />
    
    <!-- Agent Head -->
    <circle cx="22" cy="19.8" r="4.2" fill="#ffffff" />
    
    <!-- Agent Shoulders -->
    <path d="M 15 31 C 15 26.2 18.2 24.8 22 24.8 C 25.8 24.8 29 26.2 29 31 Z" fill="#ffffff" />
    
    <!-- Microphone Boom with Green Live Indicator -->
    <path d="M 15.5 23.5 C 16 27.5 19 28.5 21.8 27.8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="22.2" cy="27.6" r="1.3" fill="#22c55e" />
  </g>

  <!-- Connectivity Signal Arcs (BPJS Green) -->
  <path d="M 43 18 A 8 8 0 0 1 43 30" fill="none" stroke="#009b4c" stroke-width="2" stroke-linecap="round" />
  <path d="M 46.5 14 A 13.5 13.5 0 0 1 46.5 34" fill="none" stroke="#009b4c" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

  <!-- Typography Right Side -->
  <g transform="translate(54, 0)">
    <!-- CARE CENTER -->
    <text x="0" y="18" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="12" 
          font-weight="800" 
          letter-spacing="1.6" 
          fill="#0b2545">CARE CENTER</text>
    
    <!-- 165 -->
    <text x="0" y="42" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="23" 
          font-weight="900" 
          letter-spacing="0.8" 
          fill="url(#num-grad)">165</text>
  </g>
</svg>